name: Build MyRoadbook iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o MyRoadbook-iOS.zip

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd MyRoadbook
          xcodegen generate

      - name: Build iPhone app
        run: |
          cd MyRoadbook
          xcodebuild \
            -project MyRoadbook.xcodeproj \
            -scheme MyRoadbook \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R MyRoadbook/build/Build/Products/Release-iphoneos/MyRoadbook.app Payload/
          zip -qr MyRoadbook.ipa Payload

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: MyRoadbook-iPhone
          path: MyRoadbook.ipa
